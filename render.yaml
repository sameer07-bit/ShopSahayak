services:
  - type: web
    name: shopsahayak
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WATI_API_TOKEN
        sync: false
      - key: WATI_API_URL
        value: https://live-mt-server.wati.io
